services:
  - type: web
    name: empregoja-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: empregoja-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 365d
      - key: PUBLIC_BASE_URL
        value: https://empregoja-api.onrender.com
      - key: DATA_DIR
        value: /data
